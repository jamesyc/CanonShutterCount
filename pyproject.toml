[build-system]
requires = ["setuptools==77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "canonshuttercount"
version = "0.1.0.dev0"
description = "Bounded shutter-count reader for the original Canon EOS 5D"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = ["pyusb==1.3.1"]

[tool.uv]
exclude-newer = "7 days"

[project.scripts]
canonshuttercount = "canonshuttercount.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
canonshuttercount = ["OWNER_RECOVERY.md"]
